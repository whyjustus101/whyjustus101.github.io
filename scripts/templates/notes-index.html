<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05090e">
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="author" content="whyjustus101">
    <meta property="og:title" content="{{TITLE}} · whyjustus101">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:image" content="https://whyjustus101.github.io/assets/ocean-hd-poster.webp">
    <link rel="canonical" href="{{CANONICAL}}">
    <link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
    <link rel="stylesheet" href="/material.css?v=20261013-blog">
    <link rel="stylesheet" href="/notes.css?v=20261013-blog">
    <title>{{TITLE}} · whyjustus101</title>
  </head>
  <body class="notes-page">
    <a class="skip-link" href="#note-list">跳至文章列表</a>
    <header class="site-header is-scrolled">
      <a class="wordmark" href="/" aria-label="whyjustus101，返回首页">
        <span>whyjustus101</span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/notes/" class="is-active" aria-current="page">文章</a>
      </nav>
    </header>

    <main class="notes-shell" id="notes-top">
      <header class="notes-intro">
        <h1>文章</h1>
        <p>记录所学，也写下所想。</p>
      </header>

      <section class="notes-library" aria-labelledby="library-title">
        <div class="notes-library-bar">
          <div class="notes-library-label"><h2 id="library-title">全部文章</h2><span class="notes-result-count" role="status" aria-live="polite">共 {{NOTE_COUNT}} 篇</span></div>
          <form class="notes-search" role="search" hidden>
            <label class="visually-hidden" for="note-search">搜索文章标题、简介或标签</label>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"></circle><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.5"></path></svg>
            <input id="note-search" type="search" name="q" placeholder="搜索文章" autocomplete="off">
            <button class="clear-search" type="button" aria-label="清空搜索" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></button>
          </form>
        </div>
        <div class="note-list" id="note-list" tabindex="-1">{{NOTE_LIST}}</div>
        <div class="notes-empty" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"></circle><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg><p>没有找到匹配的文章。</p></div>
      </section>

      <footer class="notes-footer">
        <div><span>© <span id="current-year">2026</span> whyjustus101</span><a href="/">返回首页</a></div>
      </footer>
    </main>
    <script type="module" src="/notes.js?v=20261013-blog"></script>
  </body>
</html>
