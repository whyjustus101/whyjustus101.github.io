<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071f2c">
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="author" content="whyjustus101">
    <meta property="og:title" content="{{TITLE}} · whyjustus101">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:image" content="https://whyjustus101.github.io/assets/ocean-surface.webp">
    <meta property="article:published_time" content="{{DATE}}">
    <link rel="canonical" href="{{CANONICAL}}">
    <link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/notes.css">
    <title>{{TITLE}} · whyjustus101</title>
  </head>
  <body class="notes-page reading-page">
    <a class="skip-link" href="#article-body">跳至文章正文</a>
    <div class="notes-backdrop" aria-hidden="true"></div>
    <div class="reading-progress" aria-hidden="true"></div>
    <header class="site-header is-scrolled">
      <a class="wordmark" href="/" aria-label="whyjustus101，返回首页">
        <svg viewBox="0 0 36 26" fill="none" aria-hidden="true"><path d="M2 10c5-8 11-8 16 0s11 8 16 0M2 18c5-8 11-8 16 0s11 8 16 0" stroke="currentColor" stroke-width="2"></path></svg>
        <span>whyjustus101<span class="wordmark-dot">.</span></span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="/#work">作品<span>Work</span></a>
        <a href="/notes/" class="is-active">笔记<span>Notes</span></a>
      </nav>
      <a class="header-github" href="https://github.com/whyjustus101" target="_blank" rel="noopener noreferrer">GitHub <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="1.6"></path></svg></a>
    </header>

    <main id="note-top">
      <header class="reading-heading notes-shell">
        <a class="back-to-notes" href="/notes/"><span aria-hidden="true">←</span> 全部笔记</a>
        <h1>{{TITLE}}</h1>
        <p class="reading-description">{{DESCRIPTION}}</p>
        <div class="reading-meta"><time datetime="{{DATE}}">{{DATE_LABEL}}</time><div class="reading-tags">{{TAGS}}</div></div>
      </header>

      <div class="reading-surface">
        <div class="reading-layout notes-shell">
          <aside class="reading-sidebar" aria-label="文章目录">
            <details class="reading-toc" open>
              <summary>本文目录 <span aria-hidden="true">⌄</span></summary>
              <nav aria-label="跳至文章章节"><ol>{{TOC}}</ol></nav>
            </details>
          </aside>
          <article class="article-body" id="article-body" tabindex="-1" aria-label="{{TITLE}}">
            {{ARTICLE_BODY}}
            <footer class="article-end"><a href="/notes/">← 返回笔记列表</a><a href="#note-top">回到文章开头 ↑</a></footer>
          </article>
        </div>
      </div>

      <footer class="notes-footer notes-shell">
        <div><span>© <span id="current-year">2026</span> whyjustus101</span><a href="/">返回首页</a></div>
      </footer>
    </main>
    <script type="module" src="/notes.js"></script>
  </body>
</html>
